<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복소수 & 그래프 웹 계산기</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly placeholder="예: 3+2*i">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('i')" class="complex">i</button>
            <button onclick="appendValue('/')" class="operator">/</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')" class="operator">*</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')" class="operator">-</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')" class="operator">+</button>
            
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="equal()" class="equal">=</button>
        </div>
    </div>

    <div class="graph-container">
        <canvas id="mathGraph"></canvas>
        <div class="graph-input">
            <input type="text" id="fnInput" placeholder="예: x * x 또는 Math.sin(x)" value="x * x">
            <button onclick="drawGraph()">그래프 그리기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
